# One-click deploy: https://render.com → New → Blueprint → this repo.
# Free tier note (ADR-0003): the instance sleeps when idle; first call
# after a nap takes ~30s. Fine for an instrument; know it's there.
services:
  - type: web
    name: assignment-mcp
    runtime: python
    plan: free
    # PINNED — mcp 2.x renamed FastMCP. buildCommand bypasses pyproject.toml,
    # so the pin must live in BOTH places. httpx and python-dotenv are direct
    # imports; they are not optional just because mcp happens to pull httpx.
    buildCommand: pip install "mcp[cli]>=1.2,<2" "httpx>=0.27" "python-dotenv>=1.0"
    startCommand: python server.py
    envVars:
      - key: CANVAS_API_TOKEN
        sync: false   # set in Render's dashboard, never committed
      - key: CANVAS_BASE_URL
        value: https://canvas.upenn.edu
      - key: TZ
        value: America/New_York   # academic week is Eastern, not the host's UTC (ADR-0007)
